name: GitHub Streak Automator

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "ThilakesB"
          git config --global user.email "200460169+ThilakesB@users.noreply.github.com"

      - name: Sync with remote
        run: |
          git pull --rebase origin main

      - name: Bump manifest.json patch version
        run: |
          python3 - <<'EOF'
          import json, os

          path = "manifest.json"
          if not os.path.exists(path):
              print("manifest.json not found, skipping version bump.")
              exit(0)

          with open(path, "r") as f:
              data = json.load(f)

          version = data.get("version", "1.0.0")
          parts = version.split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print(f"Version bumped: {version} → {data['version']}")
          EOF

      - name: Update streak-log.json
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          path = "streak-log.json"
          now = datetime.now(timezone.utc)

          if os.path.exists(path):
              with open(path, "r") as f:
                  log = json.load(f)
          else:
              log = {"total_runs": 0, "last_run": None, "history": []}

          log["total_runs"] = log.get("total_runs", 0) + 1
          log["last_run"] = now.isoformat()
          log.setdefault("history", []).append({
              "run": log["total_runs"],
              "timestamp": now.isoformat(),
              "date": now.strftime("%Y-%m-%d"),
              "utc_hour": now.hour
          })

          # Keep only last 90 entries
          log["history"] = log["history"][-90:]

          with open(path, "w") as f:
              json.dump(log, f, indent=2)
              f.write("\n")

          print(f"Run #{log['total_runs']} logged at {now.isoformat()}")
          EOF

      - name: Commit changes
        run: |
          git add manifest.json streak-log.json
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "chore(streak): auto-update [$TIMESTAMP]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin main
